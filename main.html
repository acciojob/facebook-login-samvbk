<html>
  <head>
    <title>Facebook Login</title>
  </head>
  <body>
	  <div class="login-page">
		  <div class="left">
			  <div class="logo">
				  <img alt="Facebook logo" src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg">
			  </div>
			  <div class="des">
				  <p>
					  Facebook helps you connect and share with the people in your life.
				  </p>
			  </div>
		  </div>
		  <div class="right">
			  <form>
				  <div class="email">
					  <input type="text" id="email" placeholder="Email address or phone number" required>
				  </div>
				  <div class="pass">
					  <input type="password" id="password" placeholder="Password">
				  </div>
				  <div>
					  <button class="login" type="button">Log in</button>
				  </div>
				  <br>
				  <div>
					  <a href="#">Forgotten account?</a>
				  </div>
				  <div>
					  <button type="button" class="signup">Create new account</button>
				  </div>
			  </form>
		  </div>
	  </div>
    <!-- Write your code here -->
  </body>
</html>
